<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Portfolio of Nafim Ahmed — Software Engineer, Flutter Developer, ERP Mobile App Developer, AI Engineer and IoT enthusiast."
  >
  <meta name="theme-color" content="#07111f">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Nafim Ahmed | Software Engineer">
  <meta
    property="og:description"
    content="Flutter, ERP, AI and IoT engineering portfolio of Nafim Ahmed."
  >
  <meta property="og:type" content="website">

  <link rel="manifest" href="manifest.json">
  <title>Nafim Ahmed | Software Engineer</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07111f;
    }

    body {
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 14% 16%, rgba(37, 217, 154, 0.12), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(88, 166, 255, 0.13), transparent 30%),
        #07111f;
      color: #f5f7fb;
      font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 9999;
      transition: opacity .25s ease;
    }

    .loader-mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 15px;
      background: linear-gradient(135deg, #25d99a, #58a6ff);
      color: #04120d;
      font-weight: 950;
      box-shadow: 0 10px 30px rgba(37, 217, 154, .25);
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <div class="loader-mark">NA</div>
      Loading portfolio…
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      const loading = document.getElementById("loading");
      if (!loading) return;
      loading.style.opacity = "0";
      setTimeout(() => loading.remove(), 260);
    }, { once: true });
  </script>

  <!-- Preserve the visitor analytics used by the original HTML portfolio. -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import {
      getAnalytics,
      isSupported as isAnalyticsSupported
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-analytics.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwozw0YtTZlXGFIi2aSN2J36_kbSa9dXc",
      authDomain: "chiffect-192ec.firebaseapp.com",
      projectId: "chiffect-192ec",
      storageBucket: "chiffect-192ec.firebasestorage.app",
      messagingSenderId: "236392243018",
      appId: "1:236392243018:web:278fc9bfc08c15da6fabb3",
      measurementId: "G-CZWMZQVZTJ"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const firestoreDb = getFirestore(firebaseApp);

    isAnalyticsSupported()
      .then((supported) => {
        if (supported) getAnalytics(firebaseApp);
      })
      .catch((error) => {
        console.warn("Firebase Analytics could not be initialized:", error);
      });

    function createId(prefix) {
      if (window.crypto?.randomUUID) {
        return prefix + "_" + window.crypto.randomUUID();
      }
      return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 12);
    }

    function getVisitorId() {
      const storageKey = "nafim_portfolio_visitor_id";
      let visitorId = localStorage.getItem(storageKey);
      if (!visitorId) {
        visitorId = createId("visitor");
        localStorage.setItem(storageKey, visitorId);
      }
      return visitorId;
    }

    function getSessionId() {
      const storageKey = "nafim_portfolio_session_id";
      let sessionId = sessionStorage.getItem(storageKey);
      if (!sessionId) {
        sessionId = createId("session");
        sessionStorage.setItem(storageKey, sessionId);
      }
      return sessionId;
    }

    function detectDeviceType() {
      const userAgent = navigator.userAgent.toLowerCase();
      if (/tablet|ipad|playbook|silk/.test(userAgent)) return "Tablet";
      if (/mobile|iphone|ipod|android/.test(userAgent)) return "Mobile";
      return "Desktop";
    }

    function detectBrowser() {
      const userAgent = navigator.userAgent;
      if (/Edg\//.test(userAgent)) return "Microsoft Edge";
      if (/OPR\//.test(userAgent)) return "Opera";
      if (/Firefox\//.test(userAgent)) return "Mozilla Firefox";
      if (/Chrome\//.test(userAgent)) return "Google Chrome";
      if (/Safari\//.test(userAgent) && !/Chrome\//.test(userAgent)) return "Apple Safari";
      return "Unknown";
    }

    function detectOperatingSystem() {
      const userAgent = navigator.userAgent;
      const platform = navigator.userAgentData?.platform || navigator.platform || "";
      if (/Android/i.test(userAgent)) return "Android";
      if (/iPhone|iPad|iPod/i.test(userAgent)) return "iOS/iPadOS";
      if (/Win/i.test(platform) || /Windows/i.test(userAgent)) return "Windows";
      if (/Mac/i.test(platform) || /Macintosh/i.test(userAgent)) return "macOS";
      if (/Linux/i.test(platform) || /Linux/i.test(userAgent)) return "Linux";
      return "Unknown";
    }

    function getUtmParameters() {
      const searchParams = new URLSearchParams(window.location.search);
      return {
        utmSource: searchParams.get("utm_source"),
        utmMedium: searchParams.get("utm_medium"),
        utmCampaign: searchParams.get("utm_campaign"),
        utmTerm: searchParams.get("utm_term"),
        utmContent: searchParams.get("utm_content")
      };
    }

    async function getPublicIpAddress() {
      try {
        const response = await fetch("https://api64.ipify.org?format=json", {
          method: "GET",
          cache: "no-store",
          headers: { Accept: "application/json" }
        });

        if (!response.ok) {
          throw new Error("IP service returned HTTP " + response.status);
        }

        const data = await response.json();
        return data.ip || null;
      } catch (error) {
        console.warn("Public IP address could not be collected:", error);
        return null;
      }
    }

    async function saveVisitorDetails() {
      const sessionLogKey = "nafim_firebase_visit_saved";
      if (sessionStorage.getItem(sessionLogKey) === "yes") return;

      try {
        const ipAddress = await getPublicIpAddress();
        const connection =
          navigator.connection ||
          navigator.mozConnection ||
          navigator.webkitConnection ||
          null;
        const utmParameters = getUtmParameters();

        const visitorData = {
          visitorId: getVisitorId(),
          sessionId: getSessionId(),
          ipAddress,

          visitedAt: serverTimestamp(),
          clientVisitedAt: new Date().toISOString(),

          pageUrl: window.location.href,
          pageTitle: document.title,
          pagePath: window.location.pathname,
          referrer: document.referrer || "Direct visit",

          deviceType: detectDeviceType(),
          browser: detectBrowser(),
          operatingSystem: detectOperatingSystem(),
          userAgent: navigator.userAgent,
          platform: navigator.userAgentData?.platform || navigator.platform || null,
          isMobile:
            navigator.userAgentData?.mobile ?? /mobile|android|iphone|ipad/i.test(navigator.userAgent),

          language: navigator.language || null,
          languages: Array.isArray(navigator.languages) ? navigator.languages : [],
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
          cookieEnabled: navigator.cookieEnabled,
          online: navigator.onLine,
          touchPoints: navigator.maxTouchPoints || 0,
          logicalProcessors: navigator.hardwareConcurrency || null,
          deviceMemoryGb: navigator.deviceMemory || null,

          screenWidth: window.screen?.width || null,
          screenHeight: window.screen?.height || null,
          availableScreenWidth: window.screen?.availWidth || null,
          availableScreenHeight: window.screen?.availHeight || null,
          viewportWidth: window.innerWidth,
          viewportHeight: window.innerHeight,
          pixelRatio: window.devicePixelRatio || 1,
          colorDepth: window.screen?.colorDepth || null,

          connectionType: connection?.effectiveType || null,
          connectionDownlinkMbps: connection?.downlink || null,
          connectionRttMs: connection?.rtt || null,

          ...utmParameters
        };

        await addDoc(collection(firestoreDb, "website_visitors"), visitorData);
        sessionStorage.setItem(sessionLogKey, "yes");
      } catch (error) {
        console.error("Firebase visitor tracking error:", error);
      }
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", saveVisitorDetails, { once: true });
    } else {
      saveVisitorDetails();
    }
  </script>
</body>
</html>
